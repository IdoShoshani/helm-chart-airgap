services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: helm-airgap-packager
    ports:
      - "${FLASK_PORT:-8000}:8000"
    volumes:
      - helm-airgap-data:/app/data
      # For OCI registry authentication, use ONE of these options:
      # Option 1: Mount Helm registry config (recommended - avoids credential helper issues)
      # First run: helm registry login ghcr.io (or your registry)
      # Then add: - helm-registry-config:/home/appuser/.config/helm:ro
      # Option 2: Mount Docker config (may have credential helper issues on macOS)
      # Add: - docker-config:/home/appuser/.docker/config.json:ro
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8000
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - DATA_DIR=/app/data
      - HELM_TIMEOUT=${HELM_TIMEOUT:-300}
      - HELM_RETRY_LIMIT=${HELM_RETRY_LIMIT:-3}
      - IMAGE_PULL_TIMEOUT=${IMAGE_PULL_TIMEOUT:-600}
      - MAX_IMAGES=${MAX_IMAGES:-100}
      - MAX_BUNDLE_SIZE_GB=${MAX_BUNDLE_SIZE_GB:-50}
      - IMAGE_PULL_PARALLEL=${IMAGE_PULL_PARALLEL:-5}
      - REPO_UPDATE_INTERVAL_HOURS=${REPO_UPDATE_INTERVAL_HOURS:-6}
      - REGISTRY_USERNAME=${REGISTRY_USERNAME:-}
      - REGISTRY_PASSWORD=${REGISTRY_PASSWORD:-}
      - REGISTRY_SERVER=${REGISTRY_SERVER:-}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    restart: unless-stopped
    # Authentication options for OCI registries:
    # 1. RECOMMENDED: Use helm registry login, then mount ~/.config/helm
    # 2. Set REGISTRY_USERNAME/PASSWORD/SERVER env vars (auto-login on startup)
    # 3. Mount Docker config (may fail on macOS due to credential helpers)

volumes:
  helm-airgap-data:
    # Jobs, bundles, and credentials. Inspect: docker volume inspect helm-airgap-data
